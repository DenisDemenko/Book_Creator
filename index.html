<!doctype html>
<html lang="uk" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Цифрова Майстерня Письменника — AI Платформа</title>
    <meta name="description" content="Повний цикл створення книги від ідеї та сценарію до AI-редагування, ілюстрацій, верстки та публікації." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,300..800;1,7..72,300..800&family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Застосовуємо збережену тему ДО першого малювання сторінки,
      // щоб уникнути спалаху темної теми перед перемиканням на світлу.
      (function () {
        try {
          var saved = localStorage.getItem('nova_theme');
          document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script>
      // Only the isolated Railway preview shows client boot errors visibly.
      (function () {
        if (location.hostname !== 'writer-studio-preview-production.up.railway.app') return;
        function show(message) {
          if (document.getElementById('preview-boot-error')) return;
          var box = document.createElement('div');
          box.id = 'preview-boot-error';
          box.setAttribute('role', 'alert');
          box.style.cssText = 'position:fixed;z-index:2147483647;inset:16px 12px auto;padding:20px;border-radius:16px;background:#fff8f0;color:#2c1a12;font:15px/1.5 system-ui;box-shadow:0 4px 28px #0006;overflow-wrap:anywhere';
          var title = document.createElement('strong');
          title.textContent = 'Помилка запуску тестової Studio';
          var detail = document.createElement('p');
          detail.textContent = String(message || 'Невідома помилка').slice(0, 700);
          box.append(title, detail);
          (document.body || document.documentElement).appendChild(box);
        }
        window.addEventListener('error', function (event) {
          if (event.error || event.message) show(event.message || String(event.error));
        });
        window.addEventListener('unhandledrejection', function (event) {
          show(event.reason && event.reason.message || String(event.reason));
        });
      })();
    </script>
  </head>
  <body class="h-full bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-200">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
