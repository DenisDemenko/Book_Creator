name: Wardrobe documents
on:
  pull_request:
    paths:
      - 'server/**'
      - 'server.ts'
      - 'src/**'
      - 'shared/**'
      - 'public/wardrobe-studio/**'
      - 'public/bed-studio/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/wardrobe-documents.yml'
      - '.github/scripts/**'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'server.ts'
      - 'src/**'
      - 'shared/**'
      - 'public/wardrobe-studio/**'
      - 'public/bed-studio/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/wardrobe-documents.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documents:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node --import tsx scripts/test-wardrobeDocuments.mts --browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          WARDROBE_ARTIFACTS: ${{ runner.temp }}/wardrobe-documents
      - run: node --import tsx scripts/test-bedDocuments.mts --browser
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          BED_ARTIFACTS: ${{ runner.temp }}/bed-documents
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-documents
          path: ${{ runner.temp }}/wardrobe-documents
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bed-documents
          path: ${{ runner.temp }}/bed-documents
          retention-days: 7
          if-no-files-found: ignore
