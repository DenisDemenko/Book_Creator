name: Voice Dictation CI

on:
  pull_request:
    paths:
      - 'src/components/EditorView.tsx'
      - 'src/components/VoiceDictationButton.tsx'
      - 'src/utils/voiceDictation.ts'
      - '.github/workflows/voice-dictation-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests
        run: npm run test
