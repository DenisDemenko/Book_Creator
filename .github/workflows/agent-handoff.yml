name: Agent handoff validation
on:
  pull_request:
    paths:
      - 'package*.json'
      - '.github/scripts/**'
      - 'scripts/test-agentCompanion.mjs'
      - 'scripts/agent-companion*'
      - 'server/agent*'
      - 'server/*History*'
      - 'server/githubHistory.ts'
      - 'server/githubWorkspace.ts'
      - 'src/components/GithubWorkspacePanel.tsx'
      - 'scripts/test-githubWorkspace.mts'
      - 'src/components/AdminGitHistoryView.tsx'
      - 'src/components/adminOs/*'
      - 'scripts/test-githubHistory.mts'
      - 'Dockerfile'
      - 'src/components/*Handoff*'
      - 'src/types/agentHandoff.ts'
      - 'scripts/*agent*'
      - '.github/workflows/agent-handoff.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-agentCompanion.mjs
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsx scripts/test-agentHandoff.mts
      - run: npx tsx scripts/test-githubHistory.mts
      - run: npx tsx scripts/test-githubWorkspace.mts
      - run: npm run lint
      - run: npm run journal:check
