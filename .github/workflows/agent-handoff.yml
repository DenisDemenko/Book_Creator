name: Agent handoff validation
on:
  push:
    branches: [docs/agent-session-handoff-2026-10-20]
  pull_request:
    paths:
      - 'server/agent*'
      - 'src/components/*Handoff*'
      - 'src/types/agentHandoff.ts'
      - 'scripts/*agent*'
      - '.github/workflows/agent-handoff.yml'
permissions:
  contents: read
jobs:
  companion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-agentCompanion.mjs
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/test-agentHandoff.mts
      - run: npm run lint
      - run: npm run journal:check
      - run: npm run build
