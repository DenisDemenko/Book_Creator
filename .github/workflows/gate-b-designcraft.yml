name: Gate B DesignCraft

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  gate-b:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      DESIGNCRAFT_PATH: /tmp/designcraft/bin/designcraft-cli
      DATA_DIR: /tmp/nova-designcraft-gateb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pinned DesignCraft CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -o /tmp/designcraft.tar.gz \
            https://github.com/storytold/designcraft/releases/download/v0.7.1/designcraft-0.7.1-linux-x86_64.tar.gz
          echo "05a2b2531f6f26746b4a743081fd00f9ea77822fa178663802a0eaeced6c1437  /tmp/designcraft.tar.gz" | sha256sum -c -
          mkdir -p /tmp/designcraft
          tar -xzf /tmp/designcraft.tar.gz --strip-components=1 -C /tmp/designcraft
          "$DESIGNCRAFT_PATH" --version

      - name: TypeScript
        run: npm run lint

      - name: Gate B live engine test
        run: npx tsx scripts/test-designcraftGateB.mts
