name: Gate B DesignCraft

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  gate-b:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      # The renderer changes cwd to an isolated /tmp job. Keep the shim path
      # absolute so child_process can still spawn it from there.
      DESIGNCRAFT_PATH: ${{ github.workspace }}/scripts/designcraft-cli-compat.sh
      DESIGNCRAFT_REAL_PATH: /tmp/designcraft/bin/designcraft-cli
      DATA_DIR: /tmp/nova-designcraft-gateb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install pinned DesignCraft CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -o /tmp/designcraft.tar.gz \
            https://github.com/storytold/designcraft/releases/download/v0.7.1/designcraft-0.7.1-linux-x86_64.tar.gz
          echo "05a2b2531f6f26746b4a743081fd00f9ea77822fa178663802a0eaeced6c1437  /tmp/designcraft.tar.gz" | sha256sum -c -
          mkdir -p /tmp/designcraft
          tar -xzf /tmp/designcraft.tar.gz --strip-components=1 -C /tmp/designcraft
          chmod +x ./scripts/designcraft-cli-compat.sh
          "$DESIGNCRAFT_REAL_PATH" --version
          "$DESIGNCRAFT_PATH" --version

      - name: TypeScript
        run: npm run lint

      - name: Canonical PDF pagination contract
        run: npx tsx scripts/test-canonicalPageMap.mts

      - name: PDF engine preference contract
        run: npx tsx scripts/test-pdfEnginePreference.mts

      - name: PDF render manifest contract
        run: npx tsx scripts/test-pdfRenderManifest.mts

      - name: Chromium final PDF pagination contract
        run: npx tsx scripts/test-chromiumPageMap.mts

      - name: Pandoc final PDF pagination contract
        run: npx tsx scripts/test-pandocPageMap.mts

      - name: Preview chapter navigation contract
        run: npx tsx scripts/test-previewPageMap.mts

      - name: Express wizard integrity contract
        run: npx tsx scripts/test-expressWizardIntegrity.mts

      - name: Wizard draft behavior and source/scenario API
        run: npm run test:express-draft-session && npm run test:wizard-scenarios && npm run test:wizard-scenario-routes

      - name: Express semantic handoff contract
        run: npx tsx scripts/test-expressSemanticHandoff.mts

      - name: Book Design UI regression contract
        run: npx tsx scripts/test-bookDesignUi.mts

      - name: Educational PDF templates regression contract
        run: npx tsx scripts/test-educationalPdfTemplates.mts

      - name: Course educational adapter contract
        run: npx tsx scripts/test-courseEducationalAdapter.mts

      - name: Educational semantic styles contract
        run: npx tsx scripts/test-educationalSemanticStyles.mts

      - name: Course educational design UI contract
        run: npx tsx scripts/test-courseEducationalDesignUi.mts

      - name: Preview sample metadata test
        run: npx tsx scripts/test-designcraftThemePreviewSample.mts

      - name: Scene semantic adapter test
        run: npx tsx scripts/test-designcraftSceneSemantics.mts

      - name: Semantic placement test
        run: npx tsx scripts/test-bookDesignPlacement.mts

      - name: Custom theme placement test
        run: npx tsx scripts/test-designcraftCustomThemeBlocks.mts

      - name: Gate B live engine test
        id: gateb
        continue-on-error: true
        run: npx tsx scripts/test-designcraftGateB.mts

      - name: DesignCraft diagnostics
        if: steps.gateb.outcome == 'failure'
        run: npx tsx scripts/debug-designcraftGateB.mts

      - name: Fail if Gate B failed
        if: steps.gateb.outcome == 'failure'
        run: exit 1
