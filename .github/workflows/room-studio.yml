name: Room Studio bridge
on:
  pull_request:
    paths:
      - 'server/**'
      - 'server.ts'
      - 'scripts/test-roomStudioBridge.mjs'
      - 'scripts/test-geohome.mts'
      - 'package*.json'
      - '.github/workflows/room-studio.yml'
      - '.github/scripts/**'
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'server.ts'
      - 'scripts/test-roomStudioBridge.mjs'
      - 'scripts/test-geohome.mts'
      - 'package*.json'
      - '.github/workflows/room-studio.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:room-studio
      - run: npm run test:geohome
