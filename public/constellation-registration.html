<!doctype html><html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Запис на групову зустріч — Fusion Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#F4ECE1;color:#2C1A12;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:24px 16px 64px}article{background:#FFFCF8;border:1px solid #E0D4C7;border-radius:24px;padding:24px}h1{font-size:clamp(26px,7vw,38px);line-height:1.14}.eyebrow{letter-spacing:.12em;text-transform:uppercase;color:#91643D;font-size:12px;font-weight:700}.info{padding:9px 12px;border-radius:12px;background:#F4ECE1;margin:8px 0}label{display:block;font-weight:600;font-size:14px;margin-top:16px}input,select{width:100%;border:1px solid #D9CABC;border-radius:12px;padding:12px;font:inherit;background:white;color:#2C1A12}input[type=checkbox]{width:18px;height:18px;flex:none}label.agree{display:flex;align-items:flex-start;gap:10px;font-size:13px;font-weight:400}button{border:0;border-radius:12px;background:#2E1B12;color:white;font:600 16px system-ui;padding:13px 20px;margin-top:20px;width:100%}button:disabled{opacity:.5}.muted{color:#71645A;font-size:14px}#status{font-weight:600}.honeypot{position:absolute;left:-10000px}</style></head><body><main><p class="eyebrow">Fusion Lab · Constellation Studio</p><article><h1 id="title">Завантаження події…</h1><div id="details"></div><p class="muted">Заявка не гарантує місця. Організатор зв’яжеться з вами після розгляду. Контакти інших учасників не публікуються.</p><form id="register" hidden><label for="name">Ім’я</label><input id="name" maxlength="120" required autocomplete="name"><label for="contact">Контакт для відповіді</label><input id="contact" maxlength="200" minlength="5" required><label for="role">Роль</label><select id="role"><option value="participant">Учасник із запитом</option><option value="representative">Представник</option><option value="observer">Спостерігач</option></select><div class="honeypot" aria-hidden="true"><input id="website" tabindex="-1" autocomplete="off"></div><label class="agree"><input type="checkbox" id="privacy" required><span>Погоджуюся передати ім’я, контакт і роль організатору для розгляду заявки. Це не згода на аудіо/відеозапис, публікацію або використання моєї історії в книзі.</span></label><button id="submit">Подати заявку</button></form><p id="status" role="status"></p></article></main><script>
(()=>{const token=new URLSearchParams(location.search).get('token')||'';const title=document.querySelector('#title'),details=document.querySelector('#details'),status=document.querySelector('#status'),form=document.querySelector('#register');if(!/^[a-f0-9]{32}$/.test(token)){title.textContent='Некоректне посилання';return;}const api='/api/constellation/public/'+token;fetch(api,{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Подію не знайдено');title.textContent=d.event.theme;for(const [k,label] of [['date','Дата'],['time','Час'],['venue','Місце'],['address','Адреса'],['price','Вартість, грн']]){const value=d.event[k];if(!value)continue;const line=document.createElement('p');line.className='info';line.textContent=label+': '+value;details.append(line);}form.hidden=false;}).catch(e=>{title.textContent='Подія недоступна';status.textContent=e.message;});form.addEventListener('submit',async e=>{e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;status.textContent='Надсилаємо…';try{const r=await fetch(api+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.querySelector('#name').value,contact:document.querySelector('#contact').value,role:document.querySelector('#role').value,website:document.querySelector('#website').value,privacyAccepted:document.querySelector('#privacy').checked})});const d=await r.json();if(!r.ok)throw Error(d.error||'Помилка');form.hidden=true;status.textContent='Дякуємо! Заявку надіслано. Очікуйте відповіді організатора.';}catch(err){button.disabled=false;status.textContent=err.message;}});})();
</script></body></html>
