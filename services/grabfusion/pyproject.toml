[project]
name = "grabfusion"
version = "0.1.0"
description = "GrabFusion: швидке створення курсів, інструкцій і наборів книг із фото (частина B). Працює з Studio через /api/external/v1/photo-drafts*."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.20",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pillow>=10",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grabfusion = "grabfusion.app:main"
grabfusion-mock = "grabfusion.mock_server:main"

[tool.setuptools.packages.find]
include = ["grabfusion*"]

[tool.setuptools.package-data]
grabfusion = ["contract_data/*", "contract_data/fixtures/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
